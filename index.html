<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0710" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0e0710" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="msapplication-navbutton-color" content="#0e0710">
    <meta name="apple-mobile-web-app-title" content="Timer">
    <meta name="application-name" content="Timer">
    <meta property="og:title" content="Timer">
    <!-- Anti-Cache Directives (PC, Android, iOS) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Timer</title>

    <!-- Component & Master Stylesheets -->
    <link rel="stylesheet" href="css/flip-clock.css?v=2.2">
    <link rel="stylesheet" href="css/style.css?v=2.2">
</head>

<body>

    <!-- Ambient Glowing Light Orbs -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <main class="app-container" id="app-container">

        <!-- Top App Bar -->
        <header class="top-bar" id="top-bar">
            <div class="brand-badge">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Pronto</span>
            </div>

            <div class="top-actions">
                <!-- Version badge -->
                <div class="version-badge" title="Versione corrente">v2.2</div>

                <!-- Fullscreen button (hidden on mobile phones) -->
                <button class="icon-btn" id="btn-fullscreen" title="Schermo Intero" aria-label="Schermo intero">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"
                            d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4">
                        </path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Center Flip Clock Stage -->
        <section class="clock-stage" id="clock-stage">
            <div class="clock-container" id="clock-container" role="timer" aria-live="polite">
                <!-- Minutes Section -->
                <div class="time-section" aria-label="Minuti">
                    <div class="flip-unit" id="m-tens" data-val="-1"></div>
                    <div class="flip-unit" id="m-units" data-val="-1"></div>
                </div>

                <!-- Separator -->
                <div class="colon" aria-hidden="true">:</div>

                <!-- Seconds Section -->
                <div class="time-section" aria-label="Secondi">
                    <div class="flip-unit" id="s-tens" data-val="-1"></div>
                    <div class="flip-unit" id="s-units" data-val="-1"></div>
                </div>
            </div>

            <!-- Session Progress Indicator -->
            <div class="progress-container" title="Progresso sessione">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </section>

        <!-- Bottom Controls Glassmorphism Wrapper -->
        <div class="controls-wrapper" id="controls-wrapper">
            <div class="controls-card" id="controls-card">

                <!-- Quick Duration Presets -->
                <div class="presets-row">
                    <button class="preset-chip" data-seconds="300">5 min</button>
                    <button class="preset-chip" data-seconds="900">15 min</button>
                    <button class="preset-chip active" data-seconds="1200">20 min</button>
                    <button class="preset-chip" data-seconds="1500">25 min</button>
                    <button class="preset-chip" data-seconds="3000">50 min</button>
                </div>

                <!-- Time Inputs Row with Centered Steppers -->
                <div class="time-inputs-row">
                    <!-- Minutes input block -->
                    <div class="input-block">
                        <label for="in-m" class="input-label">Minuti</label>
                        <div class="input-stepper">
                            <button type="button" class="step-btn" data-target="in-m" data-step="-1"
                                aria-label="Diminuisci minuti">-</button>
                            <input type="text" id="in-m" value="20" inputmode="numeric" maxlength="2" pattern="[0-9]*"
                                class="time-number-input" aria-label="Imposta minuti">
                            <button type="button" class="step-btn" data-target="in-m" data-step="1"
                                aria-label="Aumenta minuti">+</button>
                        </div>
                    </div>

                    <!-- Center Colon Separator Box -->
                    <div class="colon-box" aria-hidden="true">
                        <span class="input-separator">:</span>
                    </div>

                    <!-- Seconds input block -->
                    <div class="input-block">
                        <label for="in-s" class="input-label">Secondi</label>
                        <div class="input-stepper">
                            <button type="button" class="step-btn" data-target="in-s" data-step="-5"
                                aria-label="Diminuisci secondi">-</button>
                            <input type="text" id="in-s" value="00" inputmode="numeric" maxlength="2" pattern="[0-9]*"
                                class="time-number-input" aria-label="Imposta secondi">
                            <button type="button" class="step-btn" data-target="in-s" data-step="5"
                                aria-label="Aumenta secondi">+</button>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="actions-row">
                    <button id="btn-start" class="btn-primary">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <span>Avvia</span>
                    </button>
                    <button id="btn-resume" class="btn-primary hidden">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <span>Riprendi</span>
                    </button>
                    <button id="btn-pause" class="btn-secondary hidden">
                        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                        <span>Pausa</span>
                    </button>
                    <button id="btn-reset" class="btn-ghost">
                        <span>Azzera</span>
                    </button>
                </div>

                <!-- Options & Sound Toggle -->
                <div class="options-bar">
                    <label class="toggle-label" for="sound-tick">
                        <div class="switch">
                            <input type="checkbox" id="sound-tick" checked>
                            <span class="slider"></span>
                        </div>
                        <span>Suono Flip / Ticking</span>
                    </label>
                </div>

            </div>
        </div>

    </main>

    <!-- 3-Second Countdown Overlay -->
    <div id="countdown-overlay" class="countdown-overlay" aria-hidden="true">
        <div id="countdown-number" class="countdown-number">3</div>
        <div class="countdown-subtext">Focus in arrivo...</div>
    </div>

    <!-- Core Modular Scripts -->
    <script src="js/audio.js?v=2.1"></script>
    <script src="js/clock-flip.js?v=2.1"></script>
    <script src="js/timer.js?v=2.1"></script>
    <script src="js/app.js?v=2.1"></script>
</body>

</html>
